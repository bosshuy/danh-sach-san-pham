<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table border="1">
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Áo sơ mi</td>
            <td>250.000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Quần jean</td>
            <td>400.000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Giày thể thao</td>
            <td>600.000 VNĐ</td>
            <td>8</td>
        </tr>
        <tr>
            <td>Mũ lưỡi trai</td>
            <td>100.000 VNĐ</td>
            <td>20</td>
        </tr>
    </table>

</body>
</html>
